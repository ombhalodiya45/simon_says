<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .status-container {
      text-align: center;
      padding: 2rem 3rem;
    }

    .status {
      font-size: 2rem;
      font-weight: bold;
      margin: 1rem 0;
      color: #fff;
      background-color: #dc2626;
      padding: 10px;
    }

    .label {
      font-size: 1rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>

<body style="background:#dc2626;">
  <div class="status-container">
    <div class="label">Server Status</div>
    <div class="status">Down</div>
    <div style="color:white;">200</div>
  </div>
</body>
</html>
